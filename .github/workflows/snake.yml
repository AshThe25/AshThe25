name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AshThe25
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23000000&color_dots=%23ebedf0,%23c9ccd1,%239aa0a6,%2354595e,%23000000
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffffff&color_dots=%232d333b,%23545d68,%238b949e,%23c9d1d9,%23ffffff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
